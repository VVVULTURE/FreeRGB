name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build FreeRGB.slnx -c Release
      - name: Test
        run: dotnet test FreeRGB.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Publish (trimmed, self-contained)
        shell: bash
        run: |
          RID=${{ matrix.os == 'windows-latest' && 'win-x64' || 'linux-x64' }}
          dotnet publish src/FreeRGB.App -c Release -r $RID --self-contained -p:PublishTrimmed=true -p:TrimMode=partial -o publish/$RID
      - name: Smoke test published binary starts (Linux, virtual display)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          chmod +x publish/linux-x64/FreeRGB
          xvfb-run -a bash -c 'publish/linux-x64/FreeRGB & PID=$!; sleep 8; kill -0 $PID && echo "still running after 8s" && kill $PID'
      - uses: actions/upload-artifact@v4
        with:
          name: FreeRGB-${{ matrix.os }}
          path: publish/
          if-no-files-found: error
